name: Skill Optimizer
on:
  push:
    branches: [main]
    paths: [skills/**, .github/skills/**]
  pull_request:
    paths: [skills/**, .github/skills/**]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate inputs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== Validating inputs ==="
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is REQUIRED. Add it at: Settings → Secrets → Actions → OPENAI_API_KEY
            Get your key at: https://platform.openai.com/api-keys"
            exit 1
          fi
          if [ ! -f AGENTS.md ]; then
            echo "::error::AGENTS.md not found. Create it with your skill rules."
            exit 1
          fi
          if [ ! -d tasks ] || [ -z "$(ls -A tasks/)" ]; then
            echo "::error::tasks/ directory is REQUIRED with test prompt files."
            exit 1
          fi
          echo "✓ All validations passed"

      - name: Install
        run: pip install --upgrade pip && pip install -e .

      - name: Run REAL ablation testing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "=== Running REAL ablation testing (with OpenAI API) ==="
          mkdir -p results
          skill-optimizer run \
            --agents ./AGENTS.md \
            --tasks ./tasks \
            --output ./results \
            --api-key "$OPENAI_API_KEY" \
            --use-api

      - name: Generate PR report
        run: cp .github/gen_ablation_report.py ./gen_report.py && python3 gen_report.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ablation-results
          path: results/
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const pr = context.payload.pull_request?.number || 1;
            let body = '';
            try { body = fs.readFileSync('pr_comment.md', 'utf8'); }
            catch (e) { body = '## 🤖 Skill Optimizer\n\nAblation test completed.'; }
            github.rest.issues.createComment({owner, repo, issue_number: pr, body});