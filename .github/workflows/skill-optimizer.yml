name: Skill Optimizer
on:
  push:
    branches: [main]
    paths: [skills/**, .github/skills/**]
  pull_request:
    paths: [skills/**, .github/skills/**]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Trim mode
        options: [strict, balanced, aggressive]
        default: balanced
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --upgrade pip && pip install -e .
      - name: Get mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'balanced' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
      - name: Find SKILL.md files
        id: find
        run: |
          SKILL_FILES=$(find . -name "SKILL.md" -type f ! -path "./.git/*" 2>/dev/null)
          if [ -z "$SKILL_FILES" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "$SKILL_FILES" > skill_files.txt
          fi
      - name: Run optimization
        if: steps.find.outputs.found == 'true'
        run: |
          MODE=${{ steps.mode.outputs.mode }}
          while read file; do
            skill-optimizer trim-skill --skill "$file" --output "./results" --mode "$MODE"
          done < skill_files.txt
      - name: Copy report script
        if: steps.find.outputs.found == 'true'
        run: cp .github/gen_report.py ./gen_report.py
      - name: Generate report
        if: steps.find.outputs.found == 'true'
        run: python3 gen_report.py
      - name: Upload results
        if: steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-skills
          path: results/
          retention-days: 30
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const pr = context.payload.pull_request?.number || 1;
            let body = '';
            try { body = fs.readFileSync('pr_comment.md', 'utf8'); }
            catch (e) { body = '## 🤖 Skill Optimizer\n\nNo skills found.'; }
            github.rest.issues.createComment({owner, repo, issue_number: pr, body});
      - name: No skills found
        if: steps.find.outputs.found != 'true'
        run: echo "No skills found to optimize"