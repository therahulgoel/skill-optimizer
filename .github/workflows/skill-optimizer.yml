name: Skill Optimizer
on:
  push:
    branches: [main]
    paths: [skills/**, .github/skills/**]
  pull_request:
    paths: [skills/**, .github/skills/**]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Trim mode
        options: [strict, balanced, aggressive]
        default: balanced
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install --upgrade pip && pip install -e .
      - name: Find AGENTS.md files
        id: find
        run: |
          find . -name "AGENTS.md" -type f ! -path "./.git/*" > agents_files.txt
          if [ -s agents_files.txt ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi
      - name: Run ablation testing
        if: steps.find.outputs.found == 'true'
        run: |
          MODE=${{ github.event.inputs.mode || 'balanced' }}
          mkdir -p results
          while read file; do
            skill-optimizer run --agents "$file" --tasks ./tasks --output ./results --no-cache
          done < agents_files.txt
        continue-on-error: true
      - name: Copy report script
        run: cp .github/gen_ablation_report.py ./gen_report.py
      - name: Generate report
        run: |
          if [ -d results ] && [ "$(ls -A results 2>/dev/null)" ]; then
            python3 gen_report.py
          else
            echo "## 🤖 Skill Optimizer" > pr_comment.md
            echo "" >> pr_comment.md
            echo "No ablation results. Add AGENTS.md and ./tasks/ directory." >> pr_comment.md
          fi
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ablation-results
          path: results/
          retention-days: 30
      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const pr = context.payload.pull_request?.number || 1;
            let body = '';
            try { body = fs.readFileSync('pr_comment.md', 'utf8'); }
            catch (e) { body = '## 🤖 Skill Optimizer\n\nNo skills found.'; }
            github.rest.issues.createComment({owner, repo, issue_number: pr, body});
      - name: No skills found
        if: steps.find.outputs.found != 'true'
        run: echo "No AGENTS.md found to optimize"