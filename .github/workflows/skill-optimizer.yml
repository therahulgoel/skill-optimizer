name: Skill Optimizer

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/skills/**'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/skills/**'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Trim mode
        options:
          - strict
          - balanced
          - aggressive
        default: balanced

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Skill Optimizer
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Get trim mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'balanced' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "Finding skills directories..."

      - name: Find SKILL.md files
        id: find
        run: |
          SKILL_FILES=$(find . -name "SKILL.md" -type f ! -path "./.git/*" 2>/dev/null)
          if [ -z "$SKILL_FILES" ]; then
            echo "No SKILL.md files found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "$SKILL_FILES" > skill_files.txt
            echo "files=$(cat skill_files.txt)" >> $GITHUB_OUTPUT
          fi

      - name: Run optimization
        if: steps.find.outputs.found == 'true'
        run: |
          MODE=${{ steps.mode.outputs.mode }}
          cat skill_files.txt | while read file; do
            echo "Trimming $file..."
            skill-optimizer trim-skill \
              --skill "$file" \
              --output "./results" \
              --mode "$MODE"
          done

      - name: Generate summary
        if: steps.find.outputs.found == 'true'
        id: summary
        run: |
          # Generate detailed markdown report
          {
            echo "## 🤖 Skill Optimizer Report"
            echo ""
            echo "### Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
          } > pr_comment.md

          TOTAL_SKILLS=0
          TOTAL_TOKENS=0
          for report in $(find results -name "skill_trim_report.json" 2>/dev/null); do
            if [ -f "$report" ]; then
              SKILLS=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('original_rule_count',1))" 2>/dev/null)
              TOKENS=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('actual_tokens_saved',0))" 2>/dev/null)
              TOTAL_SKILLS=$((TOTAL_SKILLS + ${SKILLS:-0}))
              TOTAL_TOKENS=$((TOTAL_TOKENS + ${TOKENS:-0}))
            fi
          done
          AVG=0
          if [ $TOTAL_SKILLS -gt 0 ]; then
            AVG=$((TOTAL_TOKENS / TOTAL_SKILLS))
          fi

          echo "| Skills | $TOTAL_SKILLS |" >> pr_comment.md
          echo "| Tokens saved | $TOTAL_TOKENS |" >> pr_comment.md
          echo "| Avg per skill | $AVG |" >> pr_comment.md

          echo "" >> pr_comment.md
          echo "### Per-Skill Breakdown" >> pr_comment.md
          echo "" >> pr_comment.md
          echo "| Skill | Original | Trimmed | Saved | Reduction |" >> pr_comment.md
          echo "|-------|----------|--------|------|----------|" >> pr_comment.md

          for report in $(find results -name "skill_trim_report.json" 2>/dev/null); do
            if [ -f "$report" ]; then
              NAME=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('name','unknown'))" 2>/dev/null)
              ORIG=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('original_rule_count',0))" 2>/dev/null)
              KEPT=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('kept_rule_count',0))" 2>/dev/null)
              SAVED=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('actual_tokens_saved',0))" 2>/dev/null)
              PCT=$(python3 -c "import json; d=json.load(open('$report')); print(d.get('skill',{}).get('token_reduction_pct',0))" 2>/dev/null)
              echo "| $NAME | $ORIG | $KEPT | $SAVED | **$PCT%** |" >> pr_comment.md
            fi
          done

          echo "" >> pr_comment.md
          echo "### Files Changed" >> pr_comment.md
          echo "" >> pr_comment.md
          for opt in $(find results -name "*.optimized.md" 2>/dev/null); do
            NAME=$(basename "$opt" .optimized.md)
            echo "- \`$opt\` - Optimized skill" >> pr_comment.md
          done

          echo "" >> pr_comment.md
          echo "---" >> pr_comment.md
          echo "*Processed by [Skill Optimizer](https://github.com/therahulgoel/skill-optimizer) by [@therahulgoel](https://github.com/therahulgoel)*" >> pr_comment.md

          cat pr_comment.md
          echo "skills=$TOTAL_SKILLS" >> $GITHUB_OUTPUT
          echo "tokens=$TOTAL_TOKENS" >> $GITHUB_OUTPUT
          echo "avg=$AVG" >> $GITHUB_OUTPUT

      - name: Upload results
        if: steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-skills
          path: results/
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const prNumber = context.payload.pull_request?.number || 1;

            let body = '';
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              body = '## 🤖 Skill Optimizer\n\nNo skills found to optimize.';
            }

            console.log('Posting comment to', owner, repo, 'PR #'+prNumber);

            github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: prNumber,
              body: body
            });

      - name: No skills found
        if: steps.find.outputs.found != 'true'
        run: echo "No skills directories found to optimize"