name: Skill Optimizer

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.github/skills/**'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/skills/**'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Trim mode
        options:
          - strict
          - balanced
          - aggressive
        default: balanced

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Skill Optimizer
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Get trim mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode || 'balanced' }}"
          echo "mode=$MODE" >> $GITHUB_OUTPUT

      - name: Find SKILL.md files
        id: find
        run: |
          SKILL_FILES=$(find . -name "SKILL.md" -type f ! -path "./.git/*" 2>/dev/null)
          if [ -z "$SKILL_FILES" ]; then
            echo "No SKILL.md files found"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "$SKILL_FILES" > skill_files.txt
          fi

      - name: Run optimization
        if: steps.find.outputs.found == 'true'
        run: |
          MODE=${{ steps.mode.outputs.mode }}
          cat skill_files.txt | while read file; do
            skill-optimizer trim-skill --skill "$file" --output "./results" --mode "$MODE"
          done

      - name: Write report script
        if: steps.find.outputs.found == 'true'
        run: |
          cat > generate_report.py << 'ENDOFSCRIPT'
          import json
          import os
          from pathlib import Path

          total_skills = 0
          total_tokens = 0
          total_kept = 0
          total_removed = 0

          reports = list(Path('results').glob('skill_trim_report.json'))

          for report_path in reports:
              try:
                  with open(report_path) as f:
                      d = json.load(f)
                  skill = d.get('skill', {})
                  total_skills += skill.get('original_rule_count', 0)
                  total_tokens += skill.get('actual_tokens_saved', 0)
                  total_kept += skill.get('kept_rule_count', 0)
                  total_removed += skill.get('removed_rule_count', 0)
              except:
                  pass

          avg = total_tokens // total_skills if total_skills > 0 else 0

          lines = []
          lines.append("## 🤖 Skill Optimizer Report")
          lines.append("")
          lines.append("> Automated ablation testing - keep what works, remove the rest")
          lines.append("")
          lines.append("### Summary")
          lines.append("")
          lines.append("| Metric | Value |")
          lines.append("|--------|-------|")
          lines.append(f"| Skills | {total_skills} |")
          lines.append(f"| Tokens saved | {total_tokens} |")
          lines.append(f"| Avg per skill | {avg} |")
          lines.append(f"| Rules kept | {total_kept} |")
          lines.append(f"| Rules removed | {total_removed} |")
          lines.append("")

          lines.append("### Per-Skill Breakdown")
          lines.append("")
          lines.append("| Skill | Original | Trimmed | Saved | Reduction |")
          lines.append("|-------|----------|--------|------|----------|")

          for report_path in reports:
              try:
                  with open(report_path) as f:
                      d = json.load(f)
                  skill = d.get('skill', {})
                  name = skill.get('name', report_path.stem)
                  orig = skill.get('original_rule_count', 0)
                  kept = skill.get('kept_rule_count', 0)
                  saved = skill.get('actual_tokens_saved', 0)
                  pct = skill.get('token_reduction_pct', 0)
                  lines.append(f"| {name} | {orig} | {kept} | {saved} | **{pct:.1f}%** |")
              except:
                  pass

          lines.append("")
          lines.append("### Rule Details")
          lines.append("")
          lines.append("#### Kept Rules (will affect behavior)")
          lines.append("")

          for report_path in reports:
              try:
                  with open(report_path) as f:
                      d = json.load(f)
                  name = d.get('skill', {}).get('name', report_path.stem)
                  lines.append(f"**{name}**")
                  lines.append("")
                  kept_rules = d.get('kept_rules', [])[:8]
                  for r in kept_rules:
                      rule_name = r.get('name', 'unnamed')
                      verdict = r.get('verdict', '')
                      lines.append(f"- {rule_name} ({verdict})")
                  lines.append("")
              except:
                  pass

          lines.append("#### Removed Rules (optimized out)")
          lines.append("")

          for report_path in reports:
              try:
                  with open(report_path) as f:
                      d = json.load(f)
                  name = d.get('skill', {}).get('name', report_path.stem)
                  lines.append(f"**{name}**")
                  lines.append("")
                  removed_rules = d.get('removed_rules', [])[:8]
                  for r in removed_rules:
                      rule_name = r.get('name', 'unnamed')
                      lines.append(f"- {rule_name}")
                  lines.append("")
              except:
                  pass

          lines.append("---")
          lines.append("*Processed by [Skill Optimizer](https://github.com/therahulgoel/skill-optimizer) by [@therahulgoel](https://github.com/therahulgoel)*")

          with open('pr_comment.md', 'w') as f:
              f.write('\n'.join(lines))
          ENDOFSCRIPT

      - name: Generate detailed report
        if: steps.find.outputs.found == 'true'
        run: python3 generate_report.py

      - name: Upload results
        if: steps.find.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trimmed-skills
          path: results/
          retention-days: 30

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const prNumber = context.payload.pull_request?.number || 1;

            let body = '';
            try {
              body = fs.readFileSync('pr_comment.md', 'utf8');
            } catch (e) {
              body = '## 🤖 Skill Optimizer\n\nNo skills found to optimize.';
            }

            github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: prNumber,
              body: body
            });

      - name: No skills found
        if: steps.find.outputs.found != 'true'
        run: echo "No skills directories found to optimize"