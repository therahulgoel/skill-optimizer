[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-optimizer"
version = "0.1.0"
description = "Minimize SKILL.md and AGENTS.md files by keeping only rules that justify their context cost"
authors = [{name = "Skill Optimizer Team"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["llm", "prompt-engineering", "developer-tools", "ablation-testing", "ai-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/therahulgoel/skill-optimizer"
Repository = "https://github.com/therahulgoel/skill-optimizer"
Issues = "https://github.com/therahulgoel/skill-optimizer/issues"

[tool.setuptools.packages.find]

[project.scripts]
skill-optimizer = "cli.main:cli"
context-surgeon = "cli.main:cli"
