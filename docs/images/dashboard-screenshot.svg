<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="700" viewBox="0 0 1200 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#F1F6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0b1220" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="700" rx="16" fill="url(#bg)" stroke="#E6EEF9"/>

  <!-- Sidebar -->
  <rect x="32" y="48" width="220" height="604" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
  <g font-family="Inter, Arial, sans-serif" fill="#1F2937">
    <text x="56" y="88" font-size="18" font-weight="700">Skill Optimizer</text>
    <rect x="56" y="104" width="160" height="1" fill="#E6EEF9"/>
    <text x="56" y="148" font-size="14" opacity="0.9">Recent reports</text>
    <g opacity="0.9">
      <rect x="56" y="164" width="148" height="36" rx="6" fill="#F1F5F9"/>
      <text x="68" y="188" font-size="12" fill="#0F1724">swiftui-pro</text>
      <rect x="56" y="208" width="148" height="36" rx="6" fill="#FFFFFF"/>
      <text x="68" y="232" font-size="12" fill="#0F1724">code-review</text>
      <rect x="56" y="252" width="148" height="36" rx="6" fill="#FFFFFF"/>
      <text x="68" y="276" font-size="12" fill="#0F1724">onboarding</text>
    </g>
  </g>

  <!-- Main panel -->
  <rect x="272" y="48" width="876" height="604" rx="12" fill="#WHITE" filter="url(#shadow)"/>

  <g font-family="Inter, Arial, sans-serif">
    <text x="296" y="88" font-size="20" font-weight="700" fill="#0F1724">Dashboard — Trim, compare, download</text>
    <text x="296" y="112" font-size="12" fill="#374151">Upload a SKILL.md, paste a draft, or load a report to preview optimizations.</text>

    <!-- Controls -->
    <rect x="296" y="136" width="268" height="40" rx="8" fill="#F3F8FF"/>
    <text x="312" y="162" font-size="13" fill="#0F1724">Mode: Balanced</text>
    <rect x="576" y="136" width="356" height="40" rx="8" fill="#F8FAFB" stroke="#E6EEF9"/>
    <text x="592" y="162" font-size="13" fill="#0F1724">Replacement root: /.github/skills</text>

    <!-- Comparison header -->
    <rect x="296" y="192" width="820" height="44" rx="8" fill="#FBFDFF" stroke="#EEF4FF"/>
    <text x="312" y="220" font-size="13" fill="#0F1724">Original rules: <tspan font-weight="700">30</tspan> · Optimized: <tspan font-weight="700">17</tspan> · Saved: <tspan font-weight="700">46%</tspan></text>

    <!-- Panels -->
    <rect x="296" y="248" width="384" height="340" rx="8" fill="#FEFEFF" stroke="#F1F5F9"/>
    <rect x="716" y="248" width="400" height="340" rx="8" fill="#FEFEFF" stroke="#F1F5F9"/>

    <text x="312" y="276" font-size="13" fill="#374151">Kept rules</text>
    <text x="732" y="276" font-size="13" fill="#374151">Removed rules</text>

    <g font-size="12" fill="#0F1724" opacity="0.95">
      <text x="312" y="300">• Keep: Do not include implementation details that leak secrets.</text>
      <text x="312" y="320">• Keep: Output format instructions required by reviewers.</text>
      <text x="312" y="340">• Keep: Platform constraints and runtime flags.</text>

      <text x="732" y="300">• Remove: Long examples and sample outputs.</text>
      <text x="732" y="320">• Remove: Editorial prose and duplicated steps.</text>
      <text x="732" y="340">• Remove: Redundant checklists and filler.</text>
    </g>

    <!-- Download buttons -->
    <rect x="832" y="608" width="124" height="28" rx="6" fill="#0B70FF"/>
    <text x="856" y="628" font-size="13" fill="#FFFFFF">Download</text>
    <rect x="968" y="608" width="124" height="28" rx="6" fill="#F1F5F9"/>
    <text x="1004" y="628" font-size="13" fill="#0F1724">Download report</text>
  </g>
</svg>
